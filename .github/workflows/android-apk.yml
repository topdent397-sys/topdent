name: Build TopDent Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL including /api'
        required: false
        default: 'https://topdent-production-654a.up.railway.app/api'
        type: string
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.TOPDENT_API_URL || 'https://topdent-production-654a.up.railway.app/api' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Cache Gradle distribution and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Configure Gradle memory for GitHub runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/gradle.properties')
          lines = path.read_text().splitlines()
          properties = {
              'org.gradle.jvmargs': '-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8',
              'org.gradle.parallel': 'false',
              'org.gradle.workers.max': '2',
          }
          for key, value in properties.items():
              prefix = f'{key}='
              indexes = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if indexes:
                  lines[indexes[0]] = f'{prefix}{value}'
                  for index in reversed(indexes[1:]):
                      lines.pop(index)
              else:
                  lines.append(f'{prefix}{value}')
          path.write_text('\n'.join(lines) + '\n')
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper_lines = wrapper.read_text().splitlines()
          timeout_prefix = 'networkTimeout='
          timeout_line = f'{timeout_prefix}120000'
          timeout_indexes = [i for i, line in enumerate(wrapper_lines) if line.startswith(timeout_prefix)]
          if timeout_indexes:
              wrapper_lines[timeout_indexes[0]] = timeout_line
              for index in reversed(timeout_indexes[1:]):
                  wrapper_lines.pop(index)
          else:
              wrapper_lines.append(timeout_line)
          wrapper.write_text('\n'.join(wrapper_lines) + '\n')
          PY
          grep -E '^(org\.gradle\.jvmargs|org\.gradle\.parallel|org\.gradle\.workers\.max)=' android/gradle.properties
          grep '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            echo "Gradle release build attempt ${attempt}/3"
            if (cd android && ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace); then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed; retrying after a short delay for a transient distribution/dependency timeout..."
              sleep 15
            fi
          done
          exit 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: topdent-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
