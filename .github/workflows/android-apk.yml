name: Build TopDent Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL including /api'
        required: false
        default: 'https://topdent-production-654a.up.railway.app/api'
        type: string
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.TOPDENT_API_URL || 'https://topdent-production-654a.up.railway.app/api' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Configure Gradle memory for GitHub runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/gradle.properties')
          lines = path.read_text().splitlines()
          properties = {
              'org.gradle.jvmargs': '-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8',
              'org.gradle.parallel': 'false',
              'org.gradle.workers.max': '2',
          }
          for key, value in properties.items():
              prefix = f'{key}='
              indexes = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if indexes:
                  lines[indexes[0]] = f'{prefix}{value}'
                  for index in reversed(indexes[1:]):
                      lines.pop(index)
              else:
                  lines.append(f'{prefix}{value}')
          path.write_text('\n'.join(lines) + '\n')
          PY
          grep -E '^(org\.gradle\.jvmargs|org\.gradle\.parallel|org\.gradle\.workers\.max)=' android/gradle.properties
      - name: Download Gradle distribution with retries
        run: |
          GRADLE_VERSION=8.13
          GRADLE_HOME="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VERSION}-bin.zip"
            "https://repo.huaweicloud.com/gradle/gradle-${GRADLE_VERSION}-bin.zip"
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          )
          for attempt in 1 2 3 4 5; do
            echo "Gradle distribution download attempt ${attempt}/5"
            for url in "${GRADLE_URLS[@]}"; do
              echo "Downloading from ${url}"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 "$url" -o "$GRADLE_ZIP"; then
                break 2
              fi
              rm -f "$GRADLE_ZIP"
            done
            if [ "$attempt" -eq 5 ]; then
              echo "All Gradle distribution mirrors failed"
              exit 1
            fi
            if [ -f "$GRADLE_ZIP" ]; then
              break
            fi
            sleep 15
          done
          rm -rf "$GRADLE_HOME"
          mkdir -p "$GRADLE_HOME"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          echo "GRADLE_BIN=$GRADLE_HOME/bin/gradle" >> "$GITHUB_ENV"
          "$GRADLE_HOME/bin/gradle" --version
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            echo "Gradle release build attempt ${attempt}/3"
            if (cd android && "$GRADLE_BIN" assembleRelease --no-daemon --max-workers=2 --stacktrace); then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed; retrying after a short delay for a transient distribution/dependency timeout..."
              sleep 15
            fi
          done
          exit 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: topdent-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
