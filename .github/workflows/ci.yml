name: TopDent CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            mobile/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Verify backend
        run: npm --prefix server run check && npm --prefix server test
      - name: Verify web client
        run: npm --prefix client run lint && npm --prefix client run build
      - name: Verify mobile client
        run: npm --prefix mobile run lint
        continue-on-error: false
